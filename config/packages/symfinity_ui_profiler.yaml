# ui-profiler is a dev/test-only bundle (it depends on WebProfilerBundle), so its
# configuration must only be parsed in environments where the bundle is registered.
when@dev:
    symfinity_ui_profiler:
        enabled: true
        wdt:
            critical_css_inline: true
            module_preload: true

when@test:
    symfinity_ui_profiler:
        enabled: true
        wdt:
            critical_css_inline: true
            module_preload: true
