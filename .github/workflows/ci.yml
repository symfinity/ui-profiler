name: CI

# Matrix: maintained PHP x Symfony 7.4 (Symfony 8 cells deferred until symfony/monolog-bundle supports ^8).
# Pin direct symfony/* to matrix minor before update — no symfony/flex (bundle must not scaffold a Flex app on CI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', symfony: '7.4' }
          - { php: '8.3', symfony: '7.4' }
          - { php: '8.4', symfony: '7.4' }
          - { php: '8.5', symfony: '7.4' }

    name: PHPUnit + PHPStan (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}.*)

    steps:
      - uses: actions/checkout@v5

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-sf${{ matrix.symfony }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-sf${{ matrix.symfony }}-
            composer-${{ runner.os }}-${{ matrix.php }}-
            composer-${{ runner.os }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        env:
          SYMFONY_MINOR: ${{ matrix.symfony }}
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $minor = getenv('SYMFONY_MINOR') ?: '7.4';
          $manifest = json_decode(file_get_contents('composer.json'), true);
          $packages = [];
          foreach (array_merge($manifest['require'] ?? [], $manifest['require-dev'] ?? []) as $name => $_constraint) {
              if (str_starts_with($name, 'symfony/')) {
                  $packages[] = $name . ':^' . $minor;
              }
          }
          if ($packages === []) {
              fwrite(STDERR, "No symfony/* packages found in composer.json\n");
              exit(1);
          }
          passthru('composer require --no-update ' . implode(' ', array_map('escapeshellarg', $packages)));
          PHP
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies --no-scripts
          drift=""
          while IFS= read -r pkg; do
            ver=$(composer show "$pkg" --installed --format=json | php -r '$d=json_decode(stream_get_contents(STDIN)); echo $d->versions[0];')
            case "$ver" in
              v${SYMFONY_MINOR}.*) ;;
              *) drift="${drift} ${pkg}" ;;
            esac
          done < <(composer show --installed --name-only | grep '^symfony/')
          if [ -n "${drift// }" ]; then
            for pkg in $drift; do
              composer require --no-update "${pkg}:^${SYMFONY_MINOR}"
            done
            composer update symfony/* --with-all-dependencies --prefer-dist --no-interaction --no-progress --no-scripts
          fi
          while IFS= read -r pkg; do
            ver=$(composer show "$pkg" --installed --format=json | php -r '$d=json_decode(stream_get_contents(STDIN)); echo $d->versions[0];')
            case "$ver" in
              v${SYMFONY_MINOR}.*) ;;
              *)
                echo "::error::Symfony drift: $pkg $ver (expected ${SYMFONY_MINOR}.*)"
                exit 1
                ;;
            esac
          done < <(composer show --installed --name-only | grep '^symfony/')

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=512M
