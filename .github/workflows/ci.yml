name: CI

# Matrix: maintained PHP x Symfony 7.4 (Symfony 8 cells deferred until symfony/monolog-bundle supports ^8).
# Symfony minor alignment: extra.symfony.require + symfony/flex (dev) — pins transitives (console, event-dispatcher, …).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', symfony: '7.4' }
          - { php: '8.3', symfony: '7.4' }
          - { php: '8.4', symfony: '7.4' }
          - { php: '8.5', symfony: '7.4' }

    name: PHPUnit + PHPStan (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}.*)

    steps:
      - uses: actions/checkout@v5

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-sf${{ matrix.symfony }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-sf${{ matrix.symfony }}-
            composer-${{ runner.os }}-${{ matrix.php }}-
            composer-${{ runner.os }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config extra.symfony.require "${{ matrix.symfony }}.*"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
          composer show --installed --name-only | grep '^symfony/' | while read -r pkg; do
            ver=$(composer show "$pkg" --installed --format=json | php -r '$d=json_decode(stream_get_contents(STDIN)); echo $d->versions[0];')
            case "$ver" in
              v${{ matrix.symfony }}.*) ;;
              *)
                echo "::error::Symfony drift after flex pin: $pkg $ver (expected ${{ matrix.symfony }}.*)"
                exit 1
                ;;
            esac
          done

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=512M
